server.port=8080

# Application Name
spring.application.name=unfazed-backend-springboot

# Database Configuration (H2 in-memory mode for easy execution)
spring.datasource.url=jdbc:h2:mem:unfazeddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
unfazed.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
unfazed.app.jwtExpirationMs=86400000

# Razorpay Credentials (defaults for test/stub mode)
razorpay.key.id=rzp_test_unfazedKey123
razorpay.key.secret=unfazedRazorpaySecret456
